<!--
  @innoexchange channel avatar: the same mark as bot.svg in amber, so the bot and the
  channel read as a pair in a chat list without being the same picture.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B733" />
      <stop offset="1" stop-color="#E07A0C" />
    </linearGradient>

    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff" />
      <g fill="#000" stroke="#000" stroke-width="34" stroke-linejoin="round">
        <rect x="196" y="240" width="206" height="142" rx="46" />
        <path d="M368 376 L406 424 L322 382 Z" />
      </g>
    </mask>

    <mask id="back" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round">
        <rect x="92" y="116" width="206" height="142" rx="46" />
        <path d="M126 252 L84 300 L172 258 Z" />
      </g>
      <text x="195" y="191" font-size="100" fill="#000">$</text>
    </mask>

    <mask id="front" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round">
        <rect x="196" y="240" width="206" height="142" rx="46" />
        <path d="M368 376 L406 424 L322 382 Z" />
      </g>
      <text x="299" y="315" font-size="104" fill="#000">₽</text>
    </mask>

    <style>
      text {
        text-anchor: middle;
        dominant-baseline: central;
        font-family: -apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <g mask="url(#gap)"><rect width="512" height="512" fill="#fff" mask="url(#back)" /></g>
  <rect width="512" height="512" fill="#fff" mask="url(#front)" />
</svg>
